<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home Words</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: one scrolling page of big picture cards in two groups; tap a card = hear the word. Single bright theme on purpose. */
:root{
  --bg:#E7F3F1; --ink:#1F2D3D; --card:#FFFFFF; --muted:#5D6B7A;
  --app:#2E7FD0; --app-soft:#DCEBFA; --furn:#D9792B; --furn-soft:#FBE7D3; --sun:#FFD35C;
  --font-display:"Baloo 2","Arial Rounded MT Bold",system-ui,sans-serif;
  --font-body:"Baloo 2","PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button,input{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));display:flex;flex-direction:column;gap:14px}
.topbar{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0 10px;display:flex;flex-direction:column;gap:10px;border-bottom:3px solid rgba(31,45,61,.12)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{border:3px solid var(--ink);border-radius:20px;background:var(--card);display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 12px;font-family:var(--font-display);font-weight:800;font-size:clamp(1.15rem,3.6vw,1.6rem);cursor:pointer;box-shadow:0 4px 0 var(--ink);touch-action:manipulation;min-height:64px}
.cat:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.cat{flex-direction:column;gap:0;line-height:1.1}
.cat .zh{font-family:var(--font-body);font-size:clamp(1rem,3vw,1.3rem);font-weight:700;font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif}
.cat[data-cat="app"][aria-pressed="true"]{background:var(--app);color:#fff}
.cat[data-cat="furn"][aria-pressed="true"]{background:var(--furn);color:#fff}
header{display:flex;align-items:center;gap:12px}
header .logo{width:44px;height:44px}
.logo{width:52px;height:52px;flex:none}
h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:clamp(1.4rem,4vw,2rem);line-height:1.05;text-wrap:balance}
h1 small{display:block;font-size:1rem;font-weight:600;color:var(--muted)}
.section-title{margin:6px 0 0;font-family:var(--font-display);font-size:1.3rem;font-weight:800;display:flex;align-items:center;gap:8px}
.section-title i{width:14px;height:14px;border-radius:50%}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}}
@media (min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}}
@media (min-width:1200px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}
@media (max-height:500px) and (orientation:landscape){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.topbar{position:static}}
.card{border:3px solid var(--ink);background:var(--card);border-radius:20px;padding:10px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;text-align:center;position:relative;box-shadow:0 4px 0 var(--ink);touch-action:manipulation}
.card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.card .pic{width:100%;aspect-ratio:1/1;border-radius:14px;display:grid;place-items:center}
.card[data-cat="app"] .pic{background:var(--app-soft)}
.card[data-cat="furn"] .pic{background:var(--furn-soft)}
.card .pic svg{width:82%;height:82%;pointer-events:none}
.card .en{font-family:var(--font-display);font-weight:800;font-size:clamp(1.25rem,3.4vw,1.7rem);line-height:1.1;margin-top:8px;overflow-wrap:anywhere}
.card .zh{font-size:1rem;font-weight:600;color:var(--muted)}
.card .spk{position:absolute;top:6px;right:6px;width:clamp(42px,6vw,54px);height:clamp(42px,6vw,54px);border-radius:50%;background:var(--sun);border:2px solid var(--ink);display:grid;place-items:center}
.card.playing{background:#FFF6D6;outline:4px solid var(--sun);outline-offset:2px}
.card.playing .pic svg{animation:bounce .5s ease-in-out infinite alternate}
.card.playing .spk{animation:pulse .5s ease-in-out infinite alternate}
@keyframes bounce{from{transform:scale(1)}to{transform:scale(1.08) translateY(-3px)}}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.2)}}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.controls .label{font-weight:700}
.rate{display:inline-flex;border:3px solid var(--ink);border-radius:999px;overflow:hidden;background:var(--card)}
.rate button{border:0;background:transparent;padding:4px 14px;font-size:1.05rem;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:4px;font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif}
.rate .ani{width:32px;height:32px;display:block}
.rate button{padding:4px 16px}
.controls .label{font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif}
h1 .hint{display:block;font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;font-size:clamp(.9rem,2.6vw,1.05rem);font-weight:600;color:var(--muted);margin-top:2px}
.rate button[aria-pressed="true"]{background:var(--sun);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.rate button[aria-pressed="false"] .ani{opacity:.5}
.notice{background:#FFF1C9;border:2px solid var(--ink);border-radius:12px;padding:8px 12px;font-size:.95rem;margin:0}
.notice[hidden]{display:none}
.card .spk{cursor:pointer;padding:0}
.card .sub{font-size:.85rem;font-weight:600;color:var(--muted);margin-top:-2px}
.tip{font-size:.95rem;color:var(--muted);text-align:center;margin:0}
@media (prefers-reduced-motion:reduce){.card.playing .pic svg,.card.playing .spk{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="toprow">
      <header>
        <svg class="logo" viewBox="0 0 100 100" aria-hidden="true">
          <path d="M12 48 L50 14 L88 48" fill="none" stroke="#1F2D3D" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
          <rect x="22" y="44" width="56" height="44" rx="6" fill="#FFD35C" stroke="#1F2D3D" stroke-width="5"/>
          <rect x="42" y="60" width="16" height="28" rx="3" fill="#2E7FD0" stroke="#1F2D3D" stroke-width="4"/>
        </svg>
        <h1>Home Words<small class="hint">按一下圖片，就可以聽發音</small></h1>
      </header>
    </div>
    <div class="cats" role="group" aria-label="Categories">
      <button class="cat" type="button" data-cat="app" aria-pressed="true"><span class="en">Appliances</span><span class="zh">家電</span></button>
      <button class="cat" type="button" data-cat="furn" aria-pressed="false"><span class="en">Furniture</span><span class="zh">家具</span></button>
    </div>
  </div>
  <p class="notice" id="speechNotice" hidden></p>
  <main id="list"></main>
  <p class="tip">No sound? Turn the volume up and turn off silent mode.</p>
</div>

/* ---------- Speech: reusable Web Speech API module (en-US) ---------- */
const Speech = (() => {
  const synth = ('speechSynthesis' in window) ? window.speechSynthesis : null;
  const supported = !!synth && typeof window.SpeechSynthesisUtterance === 'function';
  const PREFERRED = ['Samantha','Google US English','Microsoft Aria','Microsoft Jenny','Alex','Allison','Ava','Nicky'];
  let voice = null;
  let rate = 0.9;
  let current = null;          // utterance now speaking
  let voicesListeners = [];

  function pickVoice(){
    if(!supported) return null;
    const all = synth.getVoices() || [];
    const norm = v => (v.lang || '').replace('_','-').toLowerCase();
    const us = all.filter(v => norm(v) === 'en-us');
    const byName = list => {
      for(const name of PREFERRED){
        const v = list.find(x => x.name && x.name.indexOf(name) === 0);
        if(v) return v;
      }
      return null;
    };
    return byName(us)
        || us.find(v => v.localService)
        || us[0]
        || all.find(v => norm(v).startsWith('en'))
        || null;
  }
  function refreshVoice(){
    const v = pickVoice();
    if(v) voice = v;
    voicesListeners.forEach(fn => { try{ fn(voice); }catch(e){} });
  }
  if(supported){
    refreshVoice();                                  // voices may already be ready (Safari)
    if(typeof synth.addEventListener === 'function') synth.addEventListener('voiceschanged', refreshVoice);
    else synth.onvoiceschanged = refreshVoice;       // older Safari
  }

  function cancel(){
    if(!supported) return;
    current = null;
    try{ synth.cancel(); }catch(e){}
  }

  /* speak(text, {onStart, onEnd, onError}) — always cancels first so sounds never overlap. */
  function speak(text, handlers = {}){
    const { onStart, onEnd, onError } = handlers;
    if(!supported){ onError && onError('unsupported'); return; }
    cancel();
    if(!voice) refreshVoice();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    if(voice) u.voice = voice;
    u.rate = rate;
    u.pitch = 1;
    u.onstart = () => { if(current === u) onStart && onStart(); };
    u.onend = () => { if(current === u){ current = null; onEnd && onEnd(); } };
    u.onerror = ev => {
      if(current !== u) return;                      // an older utterance we cancelled on purpose
      current = null;
      const code = ev && ev.error;
      if(code === 'interrupted' || code === 'canceled'){ onEnd && onEnd(); return; }
      onError && onError(code || 'error');
    };
    current = u;
    try{
      if(synth.paused) synth.resume();               // Safari can be left paused after backgrounding
      synth.speak(u);
    }catch(e){
      current = null;
      onError && onError('speak-failed');
    }
  }

  function setRate(r){ rate = r; }
  function getRate(){ return rate; }
  function onVoices(fn){ voicesListeners.push(fn); }
  function destroy(){
    cancel();
    voicesListeners = [];
    if(!supported) return;
    if(typeof synth.removeEventListener === 'function') synth.removeEventListener('voiceschanged', refreshVoice);
    else if(synth.onvoiceschanged === refreshVoice) synth.onvoiceschanged = null;
  }
  return { supported, speak, cancel, setRate, getRate, onVoices, destroy, hasVoice: () => !!voice };
})();

/* ---------- Card playback ---------- */
const notice = document.getElementById('speechNotice');
function showNotice(msg){ notice.textContent = msg; notice.hidden = false; }
if(!Speech.supported){
  showNotice('This browser cannot read words aloud, so the page plays recordings instead. Chrome or Safari works best.');
}

const backup = new Audio();         // built-in recordings, used only when speech can't play
backup.preload = 'auto';
let playingCard = null;
function clearPlaying(){ if(playingCard){ playingCard.classList.remove('playing'); playingCard = null; } }
function markPlaying(card){ clearPlaying(); playingCard = card; card.classList.add('playing'); }
function stopAll(){
  Speech.cancel();
  try{ backup.pause(); }catch(e){}
  clearPlaying();
}
function playBackup(w, card){
  if(!AUDIO[w.id]) return clearPlaying();
  try{ backup.pause(); }catch(e){}
  backup.src = AUDIO[w.id];
  backup.playbackRate = Speech.getRate() < 0.9 ? 0.8 : 1;
  markPlaying(card);
  const p = backup.play();
  if(p && p.catch) p.catch(() => clearPlaying());
}
backup.addEventListener('ended', clearPlaying);
backup.addEventListener('error', clearPlaying);

function speakWord(w, card){
  stopAll();
  const text = w.say || w.en;
  if(!Speech.supported) return playBackup(w, card);
  markPlaying(card);
  Speech.speak(text, {
    onEnd: () => { if(playingCard === card) clearPlaying(); },
    onError: code => {
      if(playingCard === card) clearPlaying();
      if(code === 'not-allowed' || code === 'synthesis-failed' || code === 'synthesis-unavailable' ||
         code === 'audio-hardware' || code === 'voice-unavailable' || code === 'speak-failed' || code === 'error'){
        showNotice('The voice is not working right now, so the page plays recordings instead.');
        playBackup(w, card);
      }
    }
  });
}

const byId = Object.fromEntries(WORDS.map(w => [w.id, w]));
function onCardClick(e){
  const card = e.target.closest('.card'); if(!card) return;
  speakWord(byId[card.dataset.id], card);
}
list.addEventListener('click', onCardClick);

/* Rate toggle: Normal 0.9 / Slow 0.7 */
const rateBtns = [...document.querySelectorAll('.rate button')];
function setRate(r){
  Speech.setRate(r);
  rateBtns.forEach(b => b.setAttribute('aria-pressed', +b.dataset.rate === r ? 'true' : 'false'));
  try{ localStorage.setItem('homewords-rate', String(r)); }catch(e){}
}
rateBtns.forEach(b => b.addEventListener('click', () => setRate(+b.dataset.rate)));
Speech.setRate(0.9);

/* Category tabs */
const catBtns = [...document.querySelectorAll('.cat')];
catBtns.forEach(b => b.addEventListener('click', () => {
  if(currentCat === b.dataset.cat) return;
  stopAll();
  currentCat = b.dataset.cat;
  catBtns.forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
  renderCards();
  window.scrollTo({top:0, behavior:'smooth'});
}));

/* Cleanup: stop speech when the page is hidden or closed, and release listeners on unload. */
function onHidden(){ if(document.visibilityState === 'hidden') stopAll(); }
document.addEventListener('visibilitychange', onHidden);
function teardown(){
  stopAll();
  Speech.destroy();
  list.removeEventListener('click', onCardClick);
  document.removeEventListener('visibilitychange', onHidden);
  window.removeEventListener('pagehide', teardown);
}
window.addEventListener('pagehide', teardown);

</script>
</body>
</html>
